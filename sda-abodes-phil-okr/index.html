<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SDA Abodes — OKR Register</title>
<style>
  :root {
    --navy: #1E1B4B;
    --nav-bg: #1B1250;
    --nav-bg-2: rgba(255,255,255,0.10);
    --pink: #EC4899;
    --page-bg: #F1EFF7;
    --card-bg: #FFFFFF;
    --muted: #8B8998;
    --muted-2: #A6A4B5;
    --border: #E8E6F0;
    --border-strong: #D9D7E4;
    --blue: #2563EB;
    --blue-bg: #DBEAFE;
    --role-a: #DB2777;
    --role-a-bg: #FCE7F3;
    --role-neutral: #6B7280;
    --role-neutral-bg: #F1F0F4;
    --behind: #C2185B;
    --behind-bg: #FDE1EC;
    --ontrack: #2563EB;
    --ontrack-bg: #DFEAFE;
    --stale: #C2760A;
    --stale-bg: #FDECC8;
    --good: #15803d;
    --good-bg: #DCFCE7;
    --delete-bg: #F1615C;
    --highlight-bg: #FDF6E9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page-bg);
    color: var(--navy);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }
  button { font-family: inherit; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 0 64px; }
  .inner { padding: 0 28px; }

  /* ---- Top nav ---- */
  nav.top {
    background-color: var(--nav-bg);
    background-image:
      radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1.5px),
      linear-gradient(115deg, #150d40 0%, #241a6b 38%, #4d4098 68%, #9089c9 100%);
    background-size: 20px 20px, 100% 100%;
    background-position: 0 0, 0 0;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 28px;
    height: 62px;
  }
  .logo { display: flex; align-items: center; margin-right: 6px; }
  .logo-img { height: 42px; width: auto; display: block; }
  .quarter-select {
    display: flex; align-items: center; gap: 8px;
    background: var(--nav-bg-2);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .quarter-select .chev { opacity: 0.6; font-size: 10px; }
  .navtab {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.72);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .navtab:hover { background: var(--nav-bg-2); color: #fff; }
  .navtab.active { background: var(--pink); color: #fff; }
  .nav-spacer { flex: 1; }
  .sync-pill {
    display: flex; align-items: center; gap: 7px;
    background: var(--nav-bg-2);
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.85);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
  }
  .sync-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #34D399; flex-shrink: 0; }
  .sync-pill[data-mode="pending"] .dot { background: #FBBF24; }
  .sync-pill[data-mode="error"] { border-color: rgba(248,113,113,0.6); }
  .sync-pill[data-mode="error"] .dot { background: #F87171; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .cycle-editor {
    display: none;
    align-items: center; gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    margin: 16px 28px 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  .cycle-editor.open { display: flex; }
  .cycle-editor input[type="date"] {
    font: inherit; color: var(--navy); background: transparent; border: none; font-weight: 600;
  }

  /* ---- Stat strip ---- */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    padding: 22px 28px 0;
  }
  .stat-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px 14px;
  }
  .stat-card .dot { position: absolute; top: 16px; right: 16px; width: 8px; height: 8px; border-radius: 50%; }
  .stat-card .label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px; padding-right: 16px;
  }
  .stat-card .value { font-size: 26px; font-weight: 800; color: var(--navy); line-height: 1; }
  .stat-card .value.pink { color: var(--pink); }
  .stat-card .value.blue { color: var(--blue); }
  .stat-card .value.behind { color: var(--behind); }
  .stat-card .value.stale { color: var(--stale); }
  .stat-card .caption { font-size: 11.5px; color: var(--muted-2); margin-top: 5px; }

  /* ---- Completion panel ---- */
  .completion-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 14px 28px 0;
    padding: 22px 26px;
    display: flex;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .completion-panel .headline { min-width: 200px; }
  .completion-panel .label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .completion-panel .pct { font-size: 34px; font-weight: 800; color: var(--navy); line-height: 1; }
  .completion-panel .caption { font-size: 12px; color: var(--muted-2); margin-top: 5px; }
  .quarter-track { display: flex; align-items: flex-end; gap: 26px; flex: 1; }
  .qtile { text-align: center; padding-bottom: 8px; border-bottom: 2px solid transparent; }
  .qtile .qval { font-size: 15px; font-weight: 700; color: var(--muted-2); margin-bottom: 6px; }
  .qtile .qname { font-size: 11px; color: var(--muted-2); }
  .qtile.active { border-bottom-color: var(--navy); }
  .qtile.active .qval { color: var(--navy); font-size: 17px; }
  .qtile.active .qname { color: var(--navy); font-weight: 600; }
  .compare-col { display: flex; flex-direction: column; gap: 8px; }
  .compare-pill {
    background: var(--role-neutral-bg); color: var(--muted-2);
    font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px; text-align: center;
  }

  /* ---- Export banner ---- */
  .export-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--highlight-bg);
    border: 1px solid #F4E3B8;
    border-radius: 12px;
    margin: 14px 28px 0;
    padding: 14px 22px;
    font-size: 13px;
    color: #6B5A2E;
  }
  .btn-primary {
    background: var(--navy); color: #fff; border: none;
    font-size: 12.5px; font-weight: 700; padding: 9px 16px; border-radius: 8px; cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.9; }

  /* ---- Audit log ---- */
  .audit-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
  }
  .audit-row:last-child { border-bottom: none; }
  .audit-time {
    flex-shrink: 0; width: 168px;
    font-size: 11.5px; color: var(--muted-2); padding-top: 1px;
  }
  .audit-msg { font-size: 13px; color: var(--navy); line-height: 1.4; }
  .audit-empty {
    padding: 34px 20px; text-align: center; color: var(--muted-2); font-size: 13px;
  }
  .audit-head-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .audit-head-row .title { font-size: 13.5px; font-weight: 700; color: var(--navy); }
  .audit-head-row .count { font-size: 11.5px; color: var(--muted-2); }
  .btn-ghost-small {
    background: transparent; border: 1px solid var(--border-strong); color: var(--muted);
    font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  }
  .btn-ghost-small:hover { background: var(--role-neutral-bg); }

  /* ---- Objectives list ---- */
  .objectives-shell {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 18px 28px 0;
    overflow: hidden;
  }
  .obj-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .objectives-shell .obj-block:last-child .obj-row { border-bottom: none; }
  .drag-handle { color: var(--muted-2); font-size: 15px; cursor: grab; user-select: none; flex-shrink: 0; touch-action: none; padding: 6px 4px; margin: -6px -2px; }
  .drag-handle:hover { color: var(--text, #1F2240); }
  .drag-handle:active { cursor: grabbing; }
  .obj-block.dragging { opacity: 0.4; }
  .obj-block.dragging .obj-row { background: var(--card-bg); }
  .idx-badge {
    background: var(--role-neutral-bg); color: var(--navy);
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; flex-shrink: 0;
  }
  .chev-btn {
    background: transparent; border: none; color: var(--muted-2); cursor: pointer;
    font-size: 11px; padding: 2px; flex-shrink: 0; transition: transform 150ms ease;
  }
  .chev-btn.open { transform: rotate(90deg); }
  .obj-title-input {
    font-size: 14.5px; font-weight: 700; color: var(--navy);
    background: transparent; border: none; font-family: inherit;
    flex: 1; min-width: 120px; padding: 3px 0;
  }
  .obj-title-input:focus { outline: none; border-bottom: 1px solid var(--pink); }
  .raci-group { display: flex; gap: 6px; flex-shrink: 0; }
  .raci-pill {
    font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    background: var(--role-neutral-bg); color: var(--role-neutral);
    border: none; cursor: text; white-space: nowrap;
    font-family: inherit;
  }
  .raci-pill.r { background: var(--blue-bg); color: var(--blue); }
  .raci-pill.a { background: var(--role-a-bg); color: var(--role-a); }

  .status-pill {
    font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .status-pill.good { background: var(--ontrack-bg); color: var(--ontrack); }
  .status-pill.warning { background: var(--stale-bg); color: var(--stale); }
  .status-pill.serious { background: #FEE3D6; color: #C2410C; }
  .status-pill.critical { background: var(--behind-bg); color: var(--behind); }
  .status-pill.complete { background: var(--good-bg); color: var(--good); }
  .btn-archive { background: var(--good-bg); color: var(--good); border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .btn-archive:hover { filter: brightness(0.95); }
  .archived-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .archived-row:last-child { border-bottom: none; }
  .archived-row .info .title { font-weight: 700; color: var(--navy); font-size: 13px; }
  .archived-row .info .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .archived-row .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .archived-empty { padding: 24px 16px; color: var(--muted); font-size: 13px; }

  .obj-progress { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 96px; flex-shrink: 0; }
  .obj-progress .pct { font-size: 12.5px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  .mini-track { width: 96px; height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .mini-fill { height: 100%; background: var(--pink); border-radius: 999px; }

  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-ghost {
    background: #fff; border: 1px solid var(--border-strong); color: #4B4A5E;
    font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  }
  .btn-ghost:hover { background: #FAFAFC; }
  .btn-delete {
    background: var(--delete-bg); border: none; color: #fff;
    font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  }
  .btn-delete:hover { opacity: 0.9; }

  /* ---- KR sub-table ---- */
  .kr-panel { background: #fefaf3; border-bottom: 1px solid var(--border); }
  .kr-head-row {
    display: grid; grid-template-columns: 1fr 118px 140px 110px 120px 220px;
    gap: 10px; padding: 8px 20px 8px 56px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-2);
  }
  .kr-row {
    display: grid; grid-template-columns: 1fr 118px 140px 110px 120px 220px;
    gap: 10px; align-items: center;
    padding: 12px 20px 12px 56px;
    border-top: 1px solid var(--border);
  }
  .kr-row.stale-row { background: var(--highlight-bg); }
  .kr-main .kr-title-row { display: flex; align-items: center; gap: 8px; }
  .kr-title-input {
    font-size: 13px; font-weight: 700; color: var(--navy);
    background: transparent; border: none; font-family: inherit; padding: 2px 0; min-width: 0; flex-shrink: 1;
  }
  .kr-title-input:focus { outline: none; border-bottom: 1px solid var(--pink); }
  .stale-tag {
    background: var(--stale-bg); color: var(--stale); font-size: 9.5px; font-weight: 800;
    letter-spacing: 0.04em; padding: 2px 7px; border-radius: 5px; flex-shrink: 0;
  }
  .stale-tag.carried-tag { background: var(--blue-bg); color: var(--blue); }
  .kr-detail-input {
    display: block; width: 100%; font-size: 11.5px; color: var(--muted); background: transparent;
    border: none; font-family: inherit; margin-top: 3px; padding: 0;
  }
  .kr-detail-input:focus { outline: none; }
  .kr-meta-line { font-size: 11px; color: var(--muted-2); font-style: italic; margin-top: 3px; }

  .kr-raci-group { display: flex; flex-direction: column; gap: 4px; }
  .kr-raci-pill {
    font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 999px;
    border: none; cursor: text; font-family: inherit; width: 100%; text-align: left;
    background: var(--role-neutral-bg); color: var(--role-neutral);
  }
  .kr-raci-pill.r { background: var(--blue-bg); color: var(--blue); }
  .kr-raci-pill.a { background: var(--role-a-bg); color: var(--role-a); }
  .kr-raci-pill:focus { outline: none; box-shadow: inset 0 0 0 1px currentColor; }

  .kr-progress-cell { display: flex; flex-direction: column; gap: 6px; }
  .kr-progress-cell .fig { font-size: 12.5px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 4px; }
  .kr-progress-cell .fig input[type="number"] {
    width: 44px; font: inherit; font-weight: 700; background: #fff; border: 1px solid var(--border-strong);
    border-radius: 5px; padding: 2px 4px; color: var(--navy);
  }
  .kr-progress-cell .track { width: 100%; height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .kr-progress-cell .fill { height: 100%; background: var(--pink); }

  .kr-due-input {
    font: inherit; font-size: 12px; color: var(--navy); background: transparent; border: none;
  }

  .kr-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .kr-actions button { font-size: 11px; padding: 5px 10px; }

  .add-kr-row {
    text-align: center; padding: 10px; border-top: 1px solid var(--border);
  }
  .add-kr-row button {
    background: transparent; border: none; color: var(--navy); font-weight: 700; font-size: 12px; cursor: pointer; padding: 4px 10px;
  }
  .add-kr-row button:hover { text-decoration: underline; }

  .add-obj-row { display: flex; align-items: center; gap: 14px; padding: 18px 28px 0; }
  .add-obj-btn {
    background: var(--navy); color: #fff; border: none; font-weight: 700; font-size: 13px;
    padding: 11px 20px; border-radius: 9px; cursor: pointer;
  }
  .add-obj-btn:hover { opacity: 0.9; }
  .obj-counter { font-size: 12px; color: var(--muted-2); font-style: italic; }

  select.type-select, select.status-select {
    font: inherit; font-size: 11px; font-weight: 700; border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 4px 6px; color: var(--navy); background: #fff;
  }

  @media (max-width: 1100px) {
    .stat-row { grid-template-columns: repeat(3, 1fr); }
    .kr-head-row, .kr-row { grid-template-columns: 1fr 90px 120px; }
    .kr-head-row span:nth-child(4), .kr-head-row span:nth-child(5),
    .kr-row .kr-due-cell, .kr-row .kr-actions { display: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "sda-okr-phil-v2";
  const SYNC_ENDPOINT = "/.netlify/functions/okr-phil-sync";
  const SYNC_SECRET = "sda-phil-okr-2026";
  const uid = () => Math.random().toString(36).slice(2, 10);
  const nowISO = () => new Date().toISOString();

  function fiscalQuarterLabel(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const month = d.getMonth() + 1; // 1-12
    const calYear = d.getFullYear();
    const fyEndYear = month >= 7 ? calYear + 1 : calYear;
    const q = month >= 7 && month <= 9 ? 1 : month >= 10 ? 2 : month <= 3 ? 3 : 4;
    return "Q" + q + " FY" + String(fyEndYear).slice(-2);
  }

  function addMonthsToDate(dateStr, n) {
    const d = new Date(dateStr + "T00:00:00");
    d.setMonth(d.getMonth() + n);
    return d.toISOString().slice(0, 10);
  }

  function nextQuarterInfo() {
    const start = addMonthsToDate(state.cycleStart, 3);
    const end = addMonthsToDate(state.cycleEnd, 3);
    return { label: fiscalQuarterLabel(start), start, end };
  }

  function defaultKR(title) {
    return {
      id: uid(), title: title || "New key result", detail: "", r: "", a: "",
      type: "numeric", current: 0, target: 100, unit: "%", tasks: [],
      dueDate: "", checkInComment: "", updatedAt: nowISO(), overrideStatus: null,
      quarterLabel: null, archived: false
    };
  }
  function defaultObjective(title) {
    return { id: uid(), title: title || "New objective", r: "", a: "", c: "", i: "", expanded: false, keyResults: [defaultKR()] };
  }

  function defaultState() {
    const start = "2026-07-01";
    const end = "2026-09-30";
    const objs = [
      defaultObjective("New investment/sales updates"),
      defaultObjective("Current investor pain points"),
      defaultObjective("Acquisition update"),
      defaultObjective("Build progress updates")
    ];
    objs[0].expanded = true;
    return { cycleStart: start, cycleEnd: end, objectives: objs, auditLog: [], archivedItems: [] };
  }

  // Shared normalization applied to any state loaded from localStorage OR pulled
  // from the sync server, so both paths tolerate older documents missing fields.
  function normalizeState(parsed) {
    parsed.objectives.forEach(obj => (obj.keyResults || []).forEach(kr => {
      if (kr.r === undefined) kr.r = kr.owner || "";
      if (kr.a === undefined) kr.a = "";
      if (kr.quarterLabel === undefined) kr.quarterLabel = null;
      if (kr.archived === undefined) kr.archived = false;
    }));
    if (!Array.isArray(parsed.auditLog)) parsed.auditLog = [];
    if (!Array.isArray(parsed.archivedItems)) parsed.archivedItems = [];
    return parsed;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.objectives)) return defaultState();
      return normalizeState(parsed);
    } catch (e) { return defaultState(); }
  }

  let state = load();
  // Sync bookkeeping, persisted so unsent edits survive a reload:
  //   base  = last document this browser agreed with the server on
  //   dirty = this browser has edits the server has not confirmed yet
  const BASE_KEY = STORAGE_KEY + "-base";
  const DIRTY_KEY = STORAGE_KEY + "-dirty";
  let base = null;
  try { const b = localStorage.getItem(BASE_KEY); if (b) base = JSON.parse(b); } catch (e) { base = null; }
  let dirty = false;
  try { dirty = localStorage.getItem(DIRTY_KEY) === "1"; } catch (e) {}
  let lastSyncedAt = 0;      // 0 = never confirmed with the server this session
  let syncFailed = false;
  let syncBusy = false;
  let syncPushTimer = null;

  // Which objectives are expanded is a per-device view preference, NOT shared
  // data: syncing it meant one person's chevron click opened or closed panels
  // on everyone else's screen.
  const OPEN_KEY = STORAGE_KEY + "-open";
  let openIds = new Set();
  try { openIds = new Set(JSON.parse(localStorage.getItem(OPEN_KEY) || "[]")); } catch (e) {}
  function isOpen(obj) { return openIds.has(obj.id); }
  function setOpen(obj, open) {
    if (open) openIds.add(obj.id); else openIds.delete(obj.id);
    try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openIds])); } catch (e) {}
  }

  // Don't redraw underneath someone mid-drag or mid-typing when another
  // person's change arrives; apply it as soon as they're done.
  let dragActive = false;
  let pendingRemoteRender = false;
  function userIsBusy() {
    const a = document.activeElement;
    return dragActive || !!(a && a.matches && a.matches("input:not([type=button]):not([type=checkbox]), textarea, select"));
  }
  function renderRemote(changed) {
    if (!changed && !pendingRemoteRender) return;
    if (userIsBusy()) { pendingRemoteRender = true; return; }
    pendingRemoteRender = false;
    render();
  }
  document.addEventListener("focusout", () => setTimeout(() => renderRemote(false), 0));
  let activeTab = "register";
  const AUDIT_LOG_CAP = 300;

  function logEvent(message) {
    state.auditLog.unshift({ id: uid(), ts: nowISO(), message: message });
    if (state.auditLog.length > AUDIT_LOG_CAP) state.auditLog.length = AUDIT_LOG_CAP;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    setDirty(true);
    scheduleSyncPush();
  }

  function setDirty(v) {
    dirty = v;
    try { localStorage.setItem(DIRTY_KEY, v ? "1" : "0"); } catch (e) {}
    updateSyncLabel();
  }

  function setBase(doc) {
    base = JSON.parse(JSON.stringify(doc));
    try { localStorage.setItem(BASE_KEY, JSON.stringify(base)); } catch (e) {}
  }

  // ---- Three-way merge ------------------------------------------------------
  // Shared-state sync against a Netlify Function backed by Netlify Blobs. When
  // this browser has unsent edits and the server has also moved on, the two are
  // merged against `base` (the last version both agreed on) instead of one
  // overwriting the other: additions on either side are kept, deletions on
  // either side are honoured, and a field both sides changed goes to the
  // key result with the newer updatedAt.
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  function mergeFields(b, l, r, preferLocal, skip) {
    const out = {};
    const keys = new Set([...Object.keys(l || {}), ...Object.keys(r || {})]);
    keys.forEach(k => {
      if (skip && skip.includes(k)) return;
      const lv = l ? l[k] : undefined, rv = r ? r[k] : undefined, bv = b ? b[k] : undefined;
      if (same(lv, rv)) out[k] = lv;
      else if (same(lv, bv)) out[k] = rv;
      else if (same(rv, bv)) out[k] = lv;
      else out[k] = preferLocal ? lv : rv;
    });
    return out;
  }

  function mergeList(bList, lList, rList, mergeItem) {
    const byId = list => new Map((list || []).map(x => [x.id, x]));
    const B = byId(bList), L = byId(lList), R = byId(rList);
    const out = [];
    const take = (id) => {
      const b = B.get(id), l = L.get(id), r = R.get(id);
      if (l && r) {
        if (same(l, r)) return l;
        if (b && same(l, b)) return r;
        if (b && same(r, b)) return l;
        return mergeItem(b, l, r);
      }
      if (l && !r) return b ? (same(l, b) ? null : l) : l;  // remote deleted it (keep only if edited here since)
      if (r && !l) return b ? (same(r, b) ? null : r) : r;  // deleted here (keep only if edited remotely since)
      return null;
    };
    const seen = new Set();
    (lList || []).forEach(x => { seen.add(x.id); const m = take(x.id); if (m) out.push(m); });
    (rList || []).forEach(x => { if (seen.has(x.id)) return; seen.add(x.id); const m = take(x.id); if (m) out.push(m); });
    return out;
  }

  function mergeKR(b, l, r) {
    const localNewer = (l.updatedAt || "") >= (r.updatedAt || "");
    return mergeFields(b, l, r, localNewer);
  }

  function mergeObjective(b, l, r) {
    const out = mergeFields(b, l, r, true, ["keyResults"]);
    out.keyResults = mergeList(b && b.keyResults, l.keyResults, r.keyResults, mergeKR);
    return out;
  }

  function mergeDocs(b, l, r) {
    b = b || { objectives: [], auditLog: [], archivedItems: [] };
    const out = mergeFields(b, l, r, true, ["objectives", "auditLog", "archivedItems"]);
    out.objectives = mergeList(b.objectives, l.objectives, r.objectives, mergeObjective);
    out.archivedItems = mergeList(b.archivedItems, l.archivedItems, r.archivedItems, (bb, ll) => ll);
    const log = new Map();
    [...(r.auditLog || []), ...(l.auditLog || [])].forEach(e => log.set(e.id, e));
    out.auditLog = [...log.values()].sort((x, y) => (y.ts || "").localeCompare(x.ts || "")).slice(0, AUDIT_LOG_CAP);
    return normalizeState(out);
  }

  // ---- Sync cycle -------------------------------------------------------------
  function scheduleSyncPush() {
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(() => { syncCycle().then(renderRemote); }, 700);
  }

  async function postState(doc) {
    const res = await fetch(SYNC_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-shared-secret": SYNC_SECRET },
      body: JSON.stringify({ data: doc })
    });
    if (!res.ok) throw new Error("sync push failed: " + res.status);
  }

  // One pull→(merge)→push round-trip. Returns true if the on-screen state changed.
  async function syncCycle() {
    if (syncBusy) { scheduleSyncPush(); return false; }
    syncBusy = true;
    try {
      const res = await fetch(SYNC_ENDPOINT);
      if (!res.ok) throw new Error("sync pull failed: " + res.status);
      const body = await res.json();
      const remote = body && body.state && Array.isArray(body.state.objectives) ? normalizeState(body.state) : null;
      const before = JSON.stringify(state);
      let changed = false;

      if (!remote) {
        // Store is empty (first ever load) — seed it from this browser.
        await postState(state);
        setBase(state);
        setDirty(false);
      } else if (!dirty) {
        // Nothing unsent here: the server copy wins.
        if (!same(remote, state)) {
          if (!base) {
            // First load of the synced version on this browser: keep a copy of
            // whatever was local-only before the server copy replaces it.
            try { localStorage.setItem(STORAGE_KEY + "-pre-sync-backup", before); } catch (e) {}
          }
          state = remote; changed = true;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        }
        setBase(remote);
      } else {
        // Unsent edits here: merge them with whatever the server has now.
        const merged = same(remote, base) ? state : mergeDocs(base, state, remote);
        await postState(merged);
        if (JSON.stringify(state) === before) {
          if (!same(merged, state)) { state = merged; changed = true; }
          setDirty(false);
        } else {
          // Edited again while the push was in flight — fold that in next cycle.
          state = mergeDocs(JSON.parse(before), state, merged); changed = true;
          scheduleSyncPush();
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        setBase(merged);
      }
      syncFailed = false;
      lastSyncedAt = Date.now();
      return changed;
    } catch (e) {
      // Offline or server error — edits stay on this device, retried next poll.
      syncFailed = true;
      return false;
    } finally {
      syncBusy = false;
      updateSyncLabel();
    }
  }

  function updateSyncLabel() {
    const label = document.getElementById("syncLabel");
    const pill = label && label.closest(".sync-pill");
    if (!label) return;
    let text, mode;
    if (syncFailed) { text = dirty ? "Not synced — changes on this device only" : "Can't reach server — retrying"; mode = "error"; }
    else if (dirty) { text = "Saving…"; mode = "pending"; }
    else if (!lastSyncedAt) { text = "Connecting…"; mode = "pending"; }
    else {
      const secs = Math.round((Date.now() - lastSyncedAt) / 1000);
      text = secs < 5 ? "Synced just now" : secs < 60 ? "Synced " + secs + "s ago" : "Synced " + Math.round(secs / 60) + "m ago";
      mode = "ok";
    }
    label.textContent = text;
    if (pill) pill.dataset.mode = mode;
  }

  function krProgress(kr) {
    if (kr.type === "tasks") {
      if (!kr.tasks.length) return 0;
      return (kr.tasks.filter(t => t.done).length / kr.tasks.length) * 100;
    }
    const target = Number(kr.target) || 0;
    if (target <= 0) return 0;
    return Math.max(0, Math.min(100, ((Number(kr.current) || 0) / target) * 100));
  }
  function objProgress(obj) {
    if (!obj.keyResults.length) return 0;
    return obj.keyResults.reduce((a, kr) => a + krProgress(kr), 0) / obj.keyResults.length;
  }
  function expectedPace() {
    const start = new Date(state.cycleStart + "T00:00:00").getTime();
    const end = new Date(state.cycleEnd + "T00:00:00").getTime();
    const now = Date.now();
    if (end <= start) return 100;
    return Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100));
  }
  const STATUS_LABEL = { good: "ON TRACK", warning: "AT RISK", serious: "SLIPPING", critical: "BEHIND", complete: "COMPLETE" };
  function statusFor(progress, expected, overrideStatus) {
    if (overrideStatus) return { key: overrideStatus, label: STATUS_LABEL[overrideStatus] };
    if (progress >= 100) return { key: "complete", label: "COMPLETE" };
    const diff = progress - expected;
    if (diff >= -8) return { key: "good", label: "ON TRACK" };
    if (diff >= -20) return { key: "warning", label: "AT RISK" };
    if (diff >= -35) return { key: "serious", label: "SLIPPING" };
    return { key: "critical", label: "BEHIND" };
  }
  function isStale(kr) {
    const updated = new Date(kr.updatedAt).getTime();
    return (Date.now() - updated) / 86400000 > 7;
  }
  function fmtUpdated(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" }) +
      ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function fmtDue(dateStr) {
    if (!dateStr) return "No due date";
    return new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    if (children) for (const c of children) if (c) node.appendChild(c);
    return node;
  }

  function statusPill(status) {
    return el("span", { class: "status-pill " + status.key, text: status.label });
  }

  // Sync replaces `state` with a fresh object graph (server copy or a merge),
  // and deliberately skips redrawing while someone is typing. Handlers must
  // therefore never write to the objects captured when the row was drawn —
  // those may already be orphaned, and anything written to them is silently
  // dropped on the next save. Always resolve the live object by id instead.
  function liveObj(objId) {
    return state.objectives.find(o => o.id === objId) || null;
  }
  function liveKR(krId) {
    for (const o of state.objectives) {
      const k = (o.keyResults || []).find(x => x.id === krId);
      if (k) return k;
    }
    return null;
  }
  function liveTask(krId, taskId) {
    const k = liveKR(krId);
    return k ? (k.tasks || []).find(t => t.id === taskId) || null : null;
  }

  // ---------------- render ----------------
  function render() {
    document.getElementById("cycleStart").value = state.cycleStart;
    document.getElementById("cycleEnd").value = state.cycleEnd;
    document.getElementById("quarterLabel").textContent = fiscalQuarterLabel(state.cycleStart) + " (current)";

    const expected = expectedPace();
    const allKRs = state.objectives.flatMap(o => o.keyResults);
    const objCount = state.objectives.length;
    const avgProgress = objCount ? state.objectives.reduce((a, o) => a + objProgress(o), 0) / objCount : 0;
    const objStatuses = state.objectives.map(o => statusFor(objProgress(o), expected, null));
    const onTrack = objStatuses.filter(s => s.key === "good" || s.key === "complete").length;
    const behindAtRisk = objStatuses.filter(s => s.key !== "good" && s.key !== "complete").length;
    const completedKRs = allKRs.filter(kr => krProgress(kr) >= 100).length;
    const staleKRs = allKRs.filter(isStale).length;

    renderStats(objCount, avgProgress, onTrack, behindAtRisk, allKRs.length, completedKRs, staleKRs);
    renderCompletionPanel(avgProgress);

    document.getElementById("tabRegister").classList.toggle("active", activeTab === "register");
    document.getElementById("tabAudit").classList.toggle("active", activeTab === "audit");
    document.getElementById("tabArchived").classList.toggle("active", activeTab === "archived");

    const objectivesShell = document.getElementById("objectivesShell");
    const auditShell = document.getElementById("auditLogShell");
    const archivedShell = document.getElementById("archivedShell");
    const addObjRow = document.getElementById("addObjRow");

    objectivesShell.style.display = "none";
    auditShell.style.display = "none";
    archivedShell.style.display = "none";
    addObjRow.style.display = "none";

    if (activeTab === "audit") {
      auditShell.style.display = "";
      renderAuditLog(auditShell);
    } else if (activeTab === "archived") {
      archivedShell.style.display = "";
      renderArchivedList(archivedShell);
    } else {
      objectivesShell.style.display = "";
      addObjRow.style.display = "";
      objectivesShell.innerHTML = "";
      state.objectives.forEach((obj, i) => objectivesShell.appendChild(renderObjective(obj, i, expected)));
      wireDragReorder(objectivesShell);
    }

    document.getElementById("objCounter").textContent =
      "(" + objCount + " objective" + (objCount === 1 ? "" : "s") + " this quarter)";
  }

  function renderAuditLog(shell) {
    shell.innerHTML = "";
    const head = el("div", { class: "audit-head-row" }, [
      el("span", { class: "title", text: "Audit Log" }),
      el("span", { class: "count", text: state.auditLog.length + " event" + (state.auditLog.length === 1 ? "" : "s") + " · this device only" })
    ]);
    shell.appendChild(head);

    if (!state.auditLog.length) {
      shell.appendChild(el("div", { class: "audit-empty", text: "No changes logged yet. Actions like adding or deleting objectives and key results, check-ins, status overrides, and quarter rollovers will appear here." }));
      return;
    }

    state.auditLog.forEach(entry => {
      shell.appendChild(el("div", { class: "audit-row" }, [
        el("div", { class: "audit-time", text: fmtUpdated(entry.ts) }),
        el("div", { class: "audit-msg", text: entry.message })
      ]));
    });
  }

  function renderArchivedList(shell) {
    shell.innerHTML = "";
    const items = state.archivedItems || [];
    const head = el("div", { class: "audit-head-row" }, [
      el("span", { class: "title", text: "Archived Key Results" }),
      el("span", { class: "count", text: items.length + " item" + (items.length === 1 ? "" : "s") })
    ]);
    shell.appendChild(head);

    if (!items.length) {
      shell.appendChild(el("div", { class: "archived-empty", text: "Nothing archived yet. Key results auto-flip to COMPLETE at 100% progress — archive one from the Register tab to move it here." }));
      return;
    }

    items.forEach(item => {
      const info = el("div", { class: "info" }, [
        el("div", { class: "title", text: item.title || "Untitled" }),
        el("div", { class: "meta", text: "From \"" + (item.sourceObjective || "Untitled objective") + "\" · Archived " + fmtUpdated(item.archivedAt) })
      ]);

      const restoreBtn = el("button", { class: "btn-archive", text: "Restore as new objective" });
      restoreBtn.addEventListener("click", () => {
        if (!confirm('Restore "' + (item.title || "Untitled") + '" as a new objective for this quarter?')) return;
        const restored = defaultObjective(item.title);
        restored.r = item.r || "";
        restored.a = item.a || "";
        setOpen(restored, true);
        state.objectives.push(restored);
        state.archivedItems = state.archivedItems.filter(a => a.id !== item.id);
        logEvent('Restored archived key result "' + (item.title || "Untitled") + '" as a new objective');
        activeTab = "register";
        save(); render();
      });

      const deleteBtn = el("button", { class: "btn-delete", text: "Delete" });
      deleteBtn.addEventListener("click", () => {
        if (!confirm('Permanently delete archived item "' + (item.title || "Untitled") + '"? This cannot be undone.')) return;
        state.archivedItems = state.archivedItems.filter(a => a.id !== item.id);
        logEvent('Permanently deleted archived key result "' + (item.title || "Untitled") + '"');
        save(); render();
      });

      shell.appendChild(el("div", { class: "archived-row" }, [
        info,
        el("div", { class: "actions" }, [restoreBtn, deleteBtn])
      ]));
    });
  }

  function getDragAfterElement(shell, y) {
    const blocks = [...shell.querySelectorAll(".obj-block:not(.dragging)")];
    return blocks.reduce((closest, block) => {
      const box = block.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset, element: block };
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }

  function wireDragReorder(shell) {
    let draggingEl = null;
    let startOrder = "";

    function onMouseMove(e) {
      if (!draggingEl) return;
      e.preventDefault();
      const afterElement = getDragAfterElement(shell, e.clientY);
      if (afterElement == null) shell.appendChild(draggingEl);
      else if (afterElement !== draggingEl) shell.insertBefore(draggingEl, afterElement);
    }
    function onMouseUp() {
      if (!draggingEl) return;
      dragActive = false;
      draggingEl.classList.remove("dragging");
      const orderedIds = [...shell.querySelectorAll(".obj-block")].map(b => b.dataset.id);
      state.objectives.sort((a, b) => orderedIds.indexOf(a.id) - orderedIds.indexOf(b.id));
      draggingEl = null;
      document.body.style.userSelect = "";
      document.removeEventListener("pointermove", onMouseMove);
      document.removeEventListener("pointerup", onMouseUp);
      document.removeEventListener("pointercancel", onMouseUp);
      const moved = orderedIds.join() !== startOrder;
      if (moved) save();
      pendingRemoteRender = false;
      render();
    }

    shell.querySelectorAll(".obj-block").forEach((block) => {
      const handle = block.querySelector(".drag-handle");
      if (!handle) return;
      handle.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        startOrder = [...shell.querySelectorAll(".obj-block")].map(b => b.dataset.id).join();
        dragActive = true;
        draggingEl = block;
        block.classList.add("dragging");
        document.body.style.userSelect = "none";
        document.addEventListener("pointermove", onMouseMove);
        document.addEventListener("pointerup", onMouseUp);
        document.addEventListener("pointercancel", onMouseUp);
      });
    });
  }

  function statCard(label, value, valueClass, caption, dotColor) {
    return el("div", { class: "stat-card" }, [
      el("span", { class: "dot", style: "background:" + dotColor }),
      el("div", { class: "label", text: label }),
      el("div", { class: "value" + (valueClass ? " " + valueClass : ""), text: value }),
      el("div", { class: "caption", text: caption })
    ]);
  }

  function renderStats(objCount, avgProgress, onTrack, behindAtRisk, krCount, completedKRs, staleKRs) {
    const row = document.getElementById("statRow");
    row.innerHTML = "";
    row.appendChild(statCard("Objectives", String(objCount), null, "this quarter", "var(--pink)"));
    row.appendChild(statCard("Avg Progress", Math.round(avgProgress) + "%", null, "across KRs", "var(--good)"));
    row.appendChild(statCard("On Track", String(onTrack), "blue", "objectives", "var(--blue)"));
    row.appendChild(statCard("Behind / At Risk", String(behindAtRisk), "behind", "need attention", "var(--behind)"));
    row.appendChild(statCard("Key Results", String(krCount), null, completedKRs + " completed", "#7E77B7"));
    row.appendChild(statCard("Stale KRs", String(staleKRs), "stale", "> 7 days no update", "var(--stale)"));
  }

  function renderCompletionPanel(avgProgress) {
    const panel = document.getElementById("completionPanel");
    panel.innerHTML = "";
    const qLabel = fiscalQuarterLabel(state.cycleStart);

    const headline = el("div", { class: "headline" }, [
      el("div", { class: "label", text: "Overall OKR Completion · " + qLabel }),
      el("div", { class: "pct", text: Math.round(avgProgress) + "%" }),
      el("div", { class: "caption", text: "% of KRs Completed" })
    ]);

    const track = el("div", { class: "quarter-track" });
    ["Q2 FY26", "Q3 FY26", "Q4 FY26"].forEach(name => {
      track.appendChild(el("div", { class: "qtile" }, [
        el("div", { class: "qval", text: "—" }),
        el("div", { class: "qname", text: name })
      ]));
    });
    track.appendChild(el("div", { class: "qtile active" }, [
      el("div", { class: "qval", text: Math.round(avgProgress) + "%" }),
      el("div", { class: "qname", text: qLabel })
    ]));

    const compareCol = el("div", { class: "compare-col" }, [
      el("div", { class: "compare-pill", text: "— no data vs Q4 FY26" }),
      el("div", { class: "compare-pill", text: "— no data vs Q1 FY26" })
    ]);

    panel.appendChild(headline);
    panel.appendChild(track);
    panel.appendChild(compareCol);
  }

  function raciPill(obj, key, roleClass) {
    const labels = { r: "R", a: "A", c: "C", i: "I" };
    const input = el("input", {
      class: "raci-pill" + (roleClass ? " " + roleClass : ""),
      value: (obj[key] ? labels[key] + ": " + obj[key] : labels[key] + ": —"),
      style: "width:" + Math.max(40, (obj[key] ? obj[key].length : 1) * 7 + 26) + "px"
    });
    input.addEventListener("focus", () => { const o = liveObj(obj.id) || obj; input.value = o[key] || ""; });
    input.addEventListener("blur", () => {
      const o = liveObj(obj.id); if (!o) { render(); return; }
      o[key] = input.value.trim();
      save(); render();
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
    return input;
  }

  function krRaciPill(kr, key, roleClass, label) {
    const input = el("input", {
      class: "kr-raci-pill" + (roleClass ? " " + roleClass : ""),
      value: kr[key] ? label + ": " + kr[key] : label + ": —"
    });
    input.addEventListener("focus", () => { const k = liveKR(kr.id) || kr; input.value = k[key] || ""; });
    input.addEventListener("blur", () => {
      const k = liveKR(kr.id); if (!k) { render(); return; }
      k[key] = input.value.trim();
      save(); render();
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
    return input;
  }

  function renderObjective(obj, index, expected) {
    const wrap = el("div", { class: "obj-block", "data-id": obj.id });
    const progress = objProgress(obj);
    const status = statusFor(progress, expected, null);

    const titleInput = el("input", { class: "obj-title-input", value: obj.title, placeholder: "Objective title" });
    titleInput.addEventListener("input", () => { const o = liveObj(obj.id); if (!o) return; o.title = titleInput.value; save(); });

    const chev = el("button", { class: "chev-btn" + (isOpen(obj) ? " open" : ""), text: "▸" });
    chev.addEventListener("click", () => { setOpen(obj, !isOpen(obj)); render(); });

    const raciGroup = el("div", { class: "raci-group" }, [
      raciPill(obj, "r", "r"), raciPill(obj, "a", "a"), raciPill(obj, "c", ""), raciPill(obj, "i", "")
    ]);

    const progressCell = el("div", { class: "obj-progress" }, [
      el("div", { class: "pct", text: Math.round(progress) + "%" }),
      el("div", { class: "mini-track" }, [
        (() => { const f = el("div", { class: "mini-fill" }); f.style.width = Math.max(2, progress) + "%"; return f; })()
      ])
    ]);

    const editBtn = el("button", { class: "btn-ghost", text: "Edit" });
    editBtn.addEventListener("click", () => { setOpen(obj, !isOpen(obj)); render(); });
    const delBtn = el("button", { class: "btn-delete", text: "Delete" });
    delBtn.addEventListener("click", () => {
      if (!confirm('Delete objective "' + obj.title + '" and its key results?')) return;
      const liveO = liveObj(obj.id) || obj;
      state.objectives = state.objectives.filter(o => o.id !== obj.id);
      logEvent('Deleted objective "' + (liveO.title || "Untitled") + '" (' + liveO.keyResults.length + ' key result' + (liveO.keyResults.length === 1 ? "" : "s") + ')');
      save(); render();
    });

    const row = el("div", { class: "obj-row" }, [
      el("span", { class: "drag-handle", text: "⠿" }),
      el("span", { class: "idx-badge", text: "#" + (index + 1) }),
      chev,
      titleInput,
      raciGroup,
      statusPill(status),
      progressCell,
      el("div", { class: "row-actions" }, [editBtn, delBtn])
    ]);
    wrap.appendChild(row);

    if (isOpen(obj)) wrap.appendChild(renderKRPanel(obj, expected));

    return wrap;
  }

  function renderKRPanel(obj, expected) {
    const panel = el("div", { class: "kr-panel" });
    panel.appendChild(el("div", { class: "kr-head-row" }, [
      el("span", { text: "KEY RESULT" }), el("span", { text: "R / A" }), el("span", { text: "PROGRESS" }),
      el("span", { text: "STATUS" }), el("span", { text: "DUE" }), el("span", { text: "" })
    ]));
    obj.keyResults.forEach(kr => panel.appendChild(renderKRRow(obj, kr, expected)));

    const addRow = el("div", { class: "add-kr-row" });
    const addBtn = el("button", { text: "+ Add Key Result" });
    addBtn.addEventListener("click", () => {
      const o = liveObj(obj.id); if (!o) { render(); return; }
      o.keyResults.push(defaultKR());
      logEvent('Added a key result to "' + (o.title || "Untitled") + '"');
      save(); render();
    });
    addRow.appendChild(addBtn);
    panel.appendChild(addRow);
    return panel;
  }

  function renderKRRow(obj, kr, expected) {
    // Resolve the live key result / objective at edit time (see liveKR).
    const K = () => liveKR(kr.id);
    const O = () => liveObj(obj.id);
    const progress = krProgress(kr);
    const status = statusFor(progress, expected, kr.overrideStatus);
    const stale = isStale(kr);

    const titleInput = el("input", { class: "kr-title-input", value: kr.title, placeholder: "Key result" });
    titleInput.addEventListener("input", () => { const k = K(); if (!k) return; k.title = titleInput.value; save(); });
    const titleRow = el("div", { class: "kr-title-row" }, [titleInput]);
    if (stale) titleRow.appendChild(el("span", { class: "stale-tag", text: "STALE" }));
    const currentQuarter = fiscalQuarterLabel(state.cycleStart);
    const carried = kr.quarterLabel && kr.quarterLabel !== currentQuarter;
    if (carried) titleRow.appendChild(el("span", { class: "stale-tag carried-tag", text: "→ " + kr.quarterLabel }));

    const detailInput = el("input", { class: "kr-detail-input", value: kr.detail, placeholder: "Add a detail line (baseline → target)…" });
    detailInput.addEventListener("input", () => { const k = K(); if (!k) return; k.detail = detailInput.value; save(); });

    const metaLine = el("div", { class: "kr-meta-line" }, [
      document.createTextNode(
        (kr.checkInComment ? '"' + kr.checkInComment + '"' : "No check-in comment yet.") +
        "  ·  Updated " + fmtUpdated(kr.updatedAt)
      )
    ]);

    const main = el("div", { class: "kr-main" }, [titleRow, detailInput, metaLine]);

    const raciGroup = el("div", { class: "kr-raci-group" }, [
      krRaciPill(kr, "r", "r", "R"), krRaciPill(kr, "a", "a", "A")
    ]);

    const progressCell = el("div", { class: "kr-progress-cell" });
    if (kr.type === "numeric") {
      const cur = el("input", { type: "number", value: kr.current });
      cur.addEventListener("input", () => { const k = K(); if (!k) return; k.current = Number(cur.value) || 0; save(); render(); });
      progressCell.appendChild(el("div", { class: "fig" }, [
        cur, document.createTextNode("/ " + (Number(kr.target) || 0) + " (" + Math.round(progress) + "%)")
      ]));
    } else {
      const done = kr.tasks.filter(t => t.done).length;
      progressCell.appendChild(el("div", { class: "fig", text: done + "/" + kr.tasks.length + " tasks (" + Math.round(progress) + "%)" }));
    }
    const track = el("div", { class: "track" });
    const fill = el("div", { class: "fill" }); fill.style.width = Math.max(2, progress) + "%";
    track.appendChild(fill);
    progressCell.appendChild(track);

    const dueInput = el("input", { type: "date", class: "kr-due-input", value: kr.dueDate || "" });
    dueInput.addEventListener("change", () => { const k = K(); if (!k) return; k.dueDate = dueInput.value; save(); render(); });

    const checkInBtn = el("button", { class: "btn-ghost", text: "Check-in" });
    checkInBtn.addEventListener("click", () => {
      const kr = K(); if (!kr) { render(); return; }
      const comment = prompt("Check-in comment for \"" + kr.title + "\":", kr.checkInComment || "");
      if (comment === null) return;
      kr.checkInComment = comment;
      kr.updatedAt = nowISO();
      logEvent('Check-in on "' + (kr.title || "Untitled key result") + '"' + (comment ? ': "' + comment + '"' : " (comment cleared)"));
      save(); render();
    });
    const editBtn = el("button", { class: "btn-ghost", text: "Edit" });
    editBtn.addEventListener("click", () => {
      const kr = K(); if (!kr) { render(); return; }
      kr.type = kr.type === "numeric" ? "tasks" : "numeric";
      if (kr.type === "tasks" && !kr.tasks.length) kr.tasks.push({ id: uid(), label: "New task", done: false });
      kr.updatedAt = nowISO();
      logEvent('Changed "' + (kr.title || "Untitled key result") + '" tracking type to ' + kr.type);
      save(); render();
    });
    const overrideBtn = el("button", { class: "btn-ghost", text: "Override" });
    overrideBtn.addEventListener("click", () => {
      const kr = K(); if (!kr) { render(); return; }
      const choice = prompt("Force status for \"" + kr.title + "\" — type one of:\non track / at risk / slipping / behind\n(leave blank to clear override and use automatic pacing)", kr.overrideStatus ? STATUS_LABEL[kr.overrideStatus] : "");
      if (choice === null) return;
      const map = { "on track": "good", "at risk": "warning", "slipping": "serious", "behind": "critical" };
      kr.overrideStatus = map[choice.trim().toLowerCase()] || null;
      kr.updatedAt = nowISO();
      logEvent(kr.overrideStatus
        ? 'Forced status of "' + (kr.title || "Untitled key result") + '" to ' + STATUS_LABEL[kr.overrideStatus]
        : 'Cleared status override on "' + (kr.title || "Untitled key result") + '" (back to automatic pacing)');
      save(); render();
    });
    const nextQBtn = el("button", { class: "btn-ghost", text: "→ Next Qtr" });
    nextQBtn.addEventListener("click", () => {
      const kr = K(); if (!kr) { render(); return; }
      const next = nextQuarterInfo();
      if (!confirm('Move "' + kr.title + '" to ' + next.label + '? It stays open and keeps its current progress — nothing is reset.')) return;
      kr.quarterLabel = next.label;
      if (kr.dueDate) kr.dueDate = next.end;
      kr.checkInComment = (kr.checkInComment ? kr.checkInComment + " — " : "") + "Rolled over to " + next.label + " to finish remaining work.";
      kr.updatedAt = nowISO();
      logEvent('Rolled "' + (kr.title || "Untitled key result") + '" over to ' + next.label);
      save(); render();
    });

    const delBtn = el("button", { class: "btn-delete", text: "Delete" });
    delBtn.addEventListener("click", () => {
      const obj = O(), kr = K(); if (!obj || !kr) { render(); return; }
      obj.keyResults = obj.keyResults.filter(k => k.id !== kr.id);
      logEvent('Deleted key result "' + (kr.title || "Untitled") + '" from "' + (obj.title || "Untitled objective") + '"');
      save(); render();
    });

    const actionBtns = [checkInBtn, editBtn, overrideBtn, nextQBtn];
    if (status.key === "complete") {
      const archiveBtn = el("button", { class: "btn-archive", text: "Archive" });
      archiveBtn.addEventListener("click", () => {
        const obj = O(), kr = K(); if (!obj || !kr) { render(); return; }
        if (!confirm('Archive completed key result "' + kr.title + '"? It will move to the Archived tab, where it can be restored later as a new objective.')) return;
        obj.keyResults = obj.keyResults.filter(k => k.id !== kr.id);
        state.archivedItems.push({
          id: uid(), title: kr.title, detail: kr.detail, r: kr.r, a: kr.a,
          sourceObjective: obj.title || "Untitled objective", archivedAt: nowISO()
        });
        logEvent('Archived completed key result "' + (kr.title || "Untitled") + '" from "' + (obj.title || "Untitled objective") + '"');
        save(); render();
      });
      actionBtns.push(archiveBtn);
    }
    actionBtns.push(delBtn);

    const taskArea = kr.type === "tasks" ? renderTaskList(obj, kr) : null;

    const row = el("div", { class: "kr-row" + (stale ? " stale-row" : "") }, [
      main, raciGroup, progressCell, statusPill(status), dueInput,
      el("div", { class: "kr-actions" }, actionBtns)
    ]);

    if (taskArea) {
      const fullRow = el("div", {});
      fullRow.appendChild(row);
      fullRow.appendChild(taskArea);
      return fullRow;
    }
    return row;
  }

  function renderTaskList(obj, kr) {
    const wrap = el("div", { style: "padding:0 20px 14px 56px;" });
    const list = el("div", { style: "display:flex;flex-direction:column;gap:4px;" });
    kr.tasks.forEach(task => {
      const cb = el("input", { type: "checkbox" });
      cb.checked = !!task.done;
      cb.style.accentColor = "var(--pink)";
      cb.addEventListener("change", () => { const k = liveKR(kr.id), t = liveTask(kr.id, task.id); if (!k || !t) { render(); return; } t.done = cb.checked; k.updatedAt = nowISO(); save(); render(); });
      const label = el("input", { type: "text", value: task.label, placeholder: "Task", style: "flex:1;font:inherit;font-size:12.5px;border:none;background:transparent;color:var(--navy);" });
      label.addEventListener("input", () => { const t = liveTask(kr.id, task.id); if (!t) return; t.label = label.value; save(); });
      const del = el("button", { text: "✕", style: "background:transparent;border:none;color:var(--muted-2);cursor:pointer;font-size:12px;" });
      del.addEventListener("click", () => { const k = liveKR(kr.id); if (!k) { render(); return; } k.tasks = k.tasks.filter(t => t.id !== task.id); save(); render(); });
      list.appendChild(el("div", { style: "display:flex;align-items:center;gap:8px;" }, [cb, label, del]));
    });
    const addBtn = el("button", { text: "+ Add task", style: "background:transparent;border:none;color:var(--navy);font-weight:700;font-size:11.5px;cursor:pointer;padding:4px 0;" });
    addBtn.addEventListener("click", () => { const k = liveKR(kr.id); if (!k) { render(); return; } k.tasks.push({ id: uid(), label: "New task", done: false }); save(); render(); });
    wrap.appendChild(list);
    wrap.appendChild(addBtn);
    return wrap;
  }

  document.getElementById("cycleStart").addEventListener("change", (e) => {
    const prev = state.cycleStart;
    state.cycleStart = e.target.value;
    logEvent("Changed cycle start date from " + fmtDue(prev) + " to " + fmtDue(state.cycleStart));
    save(); render();
  });
  document.getElementById("cycleEnd").addEventListener("change", (e) => {
    const prev = state.cycleEnd;
    state.cycleEnd = e.target.value;
    logEvent("Changed cycle end date from " + fmtDue(prev) + " to " + fmtDue(state.cycleEnd));
    save(); render();
  });
  document.getElementById("quarterBtn").addEventListener("click", () => {
    document.getElementById("cycleEditor").classList.toggle("open");
  });
  document.getElementById("addObjBtn").addEventListener("click", () => {
    const added = defaultObjective("New objective");
    setOpen(added, true);
    state.objectives.push(added);
    logEvent("Added a new objective");
    save(); render();
  });
  document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "sda-okr-register-" + state.cycleStart + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    logEvent("Exported the register to JSON");
    save();
  });
  document.getElementById("tabSummary").addEventListener("click", () => {
    alert("Quarter Summary is not built yet in this register — the objective list already rolls every key result up into the stat strip and completion panel above.");
  });
  document.getElementById("tabRegister").addEventListener("click", () => { activeTab = "register"; render(); });
  document.getElementById("tabAudit").addEventListener("click", () => { activeTab = "audit"; render(); });
  document.getElementById("tabArchived").addEventListener("click", () => { activeTab = "archived"; render(); });

  setInterval(updateSyncLabel, 3000);

  // Sync with the shared server copy before first paint, then poll so an open
  // tab picks up edits made by other staff (and retries anything unsent).
  updateSyncLabel();
  syncCycle().catch(() => {}).then(() => { render(); });
  setInterval(() => { syncCycle().then(renderRemote); }, 10000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) syncCycle().then(renderRemote);
  });
})();
</script>
</body>
</html>
